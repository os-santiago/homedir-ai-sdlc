apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: homedir-ai-sdlc
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-egress
  namespace: homedir-ai-sdlc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-sdlc-control-plane
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 4222}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 4317}
