apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homedir-ai-sdlc

resources:
  - namespace.yaml
  - configmap.yaml
  - worker-pvc.yaml
  - worker-deployment.yaml
  - dashboard-deployment.yaml
  - dashboard-service.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: homedir-ai-sdlc
  app.kubernetes.io/managed-by: kustomize
  deployment: k3s-vps

# Use local-path provisioner (K3s default)
# No need for external storage class

# Resource profile for 4GB VPS
patches:
  - path: resource-limits-4gb.yaml
    target:
      kind: Deployment
