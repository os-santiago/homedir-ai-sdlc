apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sdlc-implementation
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/os-santiago/homedir-ai-sdlc.git
    targetRevision: main
    path: deploy/helm/implementation
    helm:
      valueFiles:
        - ../../gitops/implementation-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: homedir-ai-sdlc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
