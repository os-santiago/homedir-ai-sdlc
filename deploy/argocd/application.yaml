apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sdlc
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default

  source:
    repoURL: https://github.com/os-santiago/homedir-ai-sdlc.git
    targetRevision: main
    path: deploy/gitops

  destination:
    server: https://kubernetes.default.svc
    namespace: homedir-ai-sdlc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  # Notifications
  revisionHistoryLimit: 10
