# Application
quarkus.application.name=ai-sdlc-events
quarkus.application.version=2.0.0

# Production mode - DISABLE ALL dev features
quarkus.package.type=fast-jar
quarkus.live-reload.enabled=false
quarkus.dev-ui.enabled=false
quarkus.vertx.http.enable-compression=true

# HTTP - Configurable via environment variables
quarkus.http.host=${HTTP_HOST:0.0.0.0}
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Database - PostgreSQL Reactive - Configurable via environment variables
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:aisdlc}
quarkus.datasource.password=${DB_PASSWORD:aisdlc}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://localhost:5432/aisdlc}
quarkus.datasource.reactive.max-size=${DB_POOL_SIZE:20}

# Flyway (for schema migrations)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0.0.0
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/aisdlc}

# Hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.opensourcesantiago.aisdlc".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.json=false

# Health
quarkus.health.extensions.enabled=true

# OpenAPI
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# Scheduler
quarkus.scheduler.enabled=true

# SSE
quarkus.http.limits.max-body-size=10M

# Development mode
%dev.quarkus.log.category."io.opensourcesantiago.aisdlc".level=DEBUG
%dev.quarkus.hibernate-orm.log.sql=true

# Test mode
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
%test.quarkus.flyway.migrate-at-start=true
