# Development profile with H2 in-memory database
# No need for external PostgreSQL

# H2 Database (in-memory)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:aisdlc;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
quarkus.datasource.reactive.url=vertx-reactive:h2:mem:///aisdlc

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import-dev.sql

# Flyway - disable for H2 dev mode
quarkus.flyway.migrate-at-start=false

# HTTP
quarkus.http.port=8080

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.opensourcesantiago.aisdlc".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# Dev Services - disable
quarkus.devservices.enabled=false
