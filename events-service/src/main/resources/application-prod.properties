# Production Configuration
# Override with: ./mvnw quarkus:dev -Dquarkus.profile=prod

# Application
quarkus.application.name=ai-sdlc-events
quarkus.application.version=1.0.0

# HTTP
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.host=${HTTP_HOST:0.0.0.0}
quarkus.http.cors=true
quarkus.http.cors.origins=/https?://.*\\.example\\.com/
quarkus.http.limits.max-body-size=10M

# Database - PostgreSQL Reactive (PRODUCTION)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:aisdlc}
quarkus.datasource.password=${DB_PASSWORD:changeme}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://localhost:5432/aisdlc}
quarkus.datasource.reactive.max-size=${DB_POOL_SIZE:50}
quarkus.datasource.reactive.idle-timeout=PT10M

# JDBC for Flyway
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/aisdlc}
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=${DB_POOL_SIZE:20}

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0.0.0
quarkus.flyway.validate-on-migrate=true

# Hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Logging - Production
quarkus.log.level=INFO
quarkus.log.category."io.opensourcesantiago.aisdlc".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false

# Health checks
quarkus.health.extensions.enabled=true
quarkus.smallrye-health.root-path=/q/health

# OpenAPI - Disabled in production (security)
quarkus.swagger-ui.always-include=false
quarkus.smallrye-openapi.enable=false

# Metrics - Prometheus
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Scheduler
quarkus.scheduler.enabled=true

# SSE
quarkus.http.limits.max-body-size=10M

# Graceful shutdown
quarkus.shutdown.timeout=30s

# Thread pool optimization
quarkus.vertx.event-loops-pool-size=4
quarkus.thread-pool.max-threads=200

# Security - Rate limiting (future)
# quarkus.rate-limiter.enabled=true
# quarkus.rate-limiter.permits-per-second=100

# Observability
quarkus.log.handler.gelf.enabled=false
# quarkus.log.handler.gelf.host=graylog.example.com
# quarkus.log.handler.gelf.port=12201
