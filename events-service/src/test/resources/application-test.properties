# Tests require docker-compose up
# Run: podman compose up -d (in PowerShell)
quarkus.datasource.db-kind=postgresql

# Reactive connection
quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:25432/ai_sdlc_test

# JDBC for Flyway
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:25432/ai_sdlc_test
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# Flyway migrations
quarkus.flyway.migrate-at-start=true

# Hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file

# Logging
quarkus.log.category."io.opensourcesantiago.aisdlc".level=DEBUG
