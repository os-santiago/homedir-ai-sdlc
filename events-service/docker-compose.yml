version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-sdlc-postgres
    environment:
      POSTGRES_DB: aisdlc
      POSTGRES_USER: aisdlc
      POSTGRES_PASSWORD: aisdlc
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisdlc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-sdlc-network

  app:
    image: ai-sdlc-events:latest
    container_name: ai-sdlc-app
    build:
      context: .
      dockerfile: deployment/docker/Containerfile
    environment:
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/aisdlc
      QUARKUS_DATASOURCE_USERNAME: aisdlc
      QUARKUS_DATASOURCE_PASSWORD: aisdlc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/aisdlc
      QUARKUS_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - ai-sdlc-network
    restart: unless-stopped

networks:
  ai-sdlc-network:
    driver: bridge

volumes:
  postgres-data:
