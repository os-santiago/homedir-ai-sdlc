version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-sdlc-postgres-prod
    environment:
      POSTGRES_DB: aisdlc
      POSTGRES_USER: aisdlc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisdlc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-sdlc-network
    restart: unless-stopped

  ai-sdlc-events:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: ai-sdlc-events-prod
    environment:
      QUARKUS_PROFILE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aisdlc
      DB_USERNAME: aisdlc
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - ai-sdlc-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  ai-sdlc-network:
    driver: bridge
