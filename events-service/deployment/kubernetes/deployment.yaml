apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sdlc-events
  labels:
    app: ai-sdlc-events
    version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-sdlc-events
  template:
    metadata:
      labels:
        app: ai-sdlc-events
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
    spec:
      containers:
        - name: ai-sdlc-events
          image: ghcr.io/os-santiago/ai-sdlc-events:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUARKUS_PROFILE
              value: "prod"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ai-sdlc-db-secret
                  key: host
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "aisdlc"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-sdlc-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-sdlc-db-secret
                  key: password
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: ai-sdlc-events
  labels:
    app: ai-sdlc-events
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: ai-sdlc-events
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-sdlc-events
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai-sdlc.example.com
      secretName: ai-sdlc-tls
  rules:
    - host: ai-sdlc.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-sdlc-events
                port:
                  number: 8080
