name: AI-SDLC Events Service - Production Release

on:
  push:
    branches:
      - main
    paths:
      - 'events-service/**'
      - '.github/workflows/events-service-release.yml'
  workflow_dispatch:
    inputs:
      release_level:
        description: 'Release Level (auto calculates if empty)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - patch
          - minor
          - major
      skip_deploy:
        description: 'Skip deployment (build and verify only, for QA)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build, Tag & Push
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    permissions:
      contents: write
      packages: write

    env:
      # Container registry configuration
      QUAY_REGISTRY: quay.io
      QUAY_IMAGE_NAME: sergio_canales_e/ai-sdlc-events
      GHCR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-sdlc-events

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Build & Tests
        run: |
          cd events-service
          # TODO: Fix H2 compatibility in SQL migrations
          ./mvnw clean package -B -DskipTests \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: Calculate Next Version
        id: version_calc
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          default_bump: patch
          custom_release_rules: feat:minor,fix:patch,chore:patch,refactor:patch,perf:patch
          release_branches: main
          tag_prefix: v
          dry_run: true

      - name: Resolve release version and tag
        id: release_meta
        env:
          CALCULATED_VERSION: ${{ steps.version_calc.outputs.new_version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          existing_tag="$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -n "${existing_tag}" ]; then
            release_tag="${existing_tag}"
            release_version="${existing_tag#v}"
            reused_tag="true"
            echo "Reusing existing tag ${release_tag} for ${GITHUB_SHA}."
          else
            release_version="${CALCULATED_VERSION}"
            release_tag="v${release_version}"
            reused_tag="false"
            echo "Resolved new release tag ${release_tag}."
          fi
          echo "new_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "reused_tag=${reused_tag}" >> "$GITHUB_OUTPUT"

      - name: Sync pom.xml revision for release tag
        id: sync_pom
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.new_version }}
        run: |
          set -euo pipefail
          sed -i -E "s#<version>[^<]+</version>#<version>${RELEASE_VERSION}</version>#" events-service/pom.xml
          if git diff --quiet -- events-service/pom.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pom.xml already aligned with ${RELEASE_VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events-service/pom.xml
          git commit -m "chore(release): sync pom version to ${RELEASE_VERSION} [skip release]"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build with Maven (production build)
        run: |
          cd events-service
          ./mvnw package -B -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        if: ${{ vars.QUAY_USERNAME != '' && secrets.QUAY_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Container Image
        env:
          TAG: ${{ steps.release_meta.outputs.new_version }}
          QUAY_IMAGE: quay.io/${{ env.QUAY_IMAGE_NAME }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE_NAME }}
        run: |
          set -euo pipefail

          # Build image
          docker build -f events-service/deployment/docker/Containerfile.fixed \
            -t ${QUAY_IMAGE}:latest \
            -t ${QUAY_IMAGE}:${TAG} \
            -t ${GHCR_IMAGE}:latest \
            -t ${GHCR_IMAGE}:${TAG} \
            events-service

          # Push to Quay.io (primary registry for webhook trigger)
          if [ -n "${{ vars.QUAY_USERNAME }}" ] && [ -n "${{ secrets.QUAY_TOKEN }}" ]; then
            echo "Pushing to Quay.io..."
            docker push ${QUAY_IMAGE}:${TAG}
            docker push ${QUAY_IMAGE}:latest
            echo "✅ Pushed to Quay.io"
          else
            echo "⚠️ Quay.io credentials not configured, skipping push"
          fi

          # Push to GHCR (backup registry)
          echo "Pushing to GitHub Container Registry..."
          docker push ${GHCR_IMAGE}:${TAG}
          docker push ${GHCR_IMAGE}:latest
          echo "✅ Pushed to GHCR"

      - name: Create release tag
        id: tag_version
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.new_version }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.new_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            existing_tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [ "${existing_tag_sha}" != "${GITHUB_SHA}" ]; then
              echo "::error::Tag ${RELEASE_TAG} already exists on ${existing_tag_sha}, expected ${GITHUB_SHA}"
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists for current commit; reusing."
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi
          echo "new_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: release_notes
        env:
          TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Find previous tag
          prev_tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n1 || true)"

          if [ -z "${prev_tag}" ]; then
            echo "## First Release" > release_notes.txt
            echo "Initial production release of AI-SDLC Events Service." >> release_notes.txt
            cat release_notes.txt
            exit 0
          fi

          # Get commits between tags
          commits="$(git log --oneline --no-merges "${prev_tag}..HEAD" --format='%s|||%an|||%h' || true)"

          if [ -z "${commits}" ]; then
            echo "## No Changes" > release_notes.txt
            echo "No new changes since ${prev_tag}." >> release_notes.txt
            cat release_notes.txt
            exit 0
          fi

          # Generate release notes
          echo "## Changes since ${prev_tag}" > release_notes.txt
          echo "" >> release_notes.txt

          # Categorize commits
          echo "### Features" >> release_notes.txt
          echo "$commits" | grep -i "^feat:" | sed 's/|||.*//' | sed 's/^/- /' >> release_notes.txt || echo "- No new features" >> release_notes.txt
          echo "" >> release_notes.txt

          echo "### Bug Fixes" >> release_notes.txt
          echo "$commits" | grep -i "^fix:" | sed 's/|||.*//' | sed 's/^/- /' >> release_notes.txt || echo "- No bug fixes" >> release_notes.txt
          echo "" >> release_notes.txt

          echo "### Other Changes" >> release_notes.txt
          echo "$commits" | grep -v -i "^feat:" | grep -v -i "^fix:" | sed 's/|||.*//' | sed 's/^/- /' >> release_notes.txt || true

          cat release_notes.txt

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          bodyFile: release_notes.txt
          draft: false
          prerelease: false
          token: ${{ github.token }}

      - name: Push pom.xml changes (if any)
        if: steps.sync_pom.outputs.changed == 'true'
        run: |
          git push origin main

      - name: Summary
        run: |
          echo "## 🚀 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.tag_version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`quay.io/${{ env.QUAY_IMAGE_NAME }}:${{ steps.tag_version.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.GHCR_IMAGE_NAME }}:${{ steps.tag_version.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Quay.io webhook will trigger automatic deployment to VPS." >> $GITHUB_STEP_SUMMARY
