name: Deploy Implementation Service

on:
  push:
    branches: [main]
    paths:
      - 'future-go/components/implementation/**'
      - 'deploy/helm/implementation/**'
      - 'deploy/gitops/implementation-values.yaml'
      - '.github/workflows/deploy-implementation.yml'

  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: 'false'
      namespace:
        description: 'Kubernetes namespace'
        required: false
        default: 'homedir-ai-sdlc'

env:
  REGISTRY: ghcr.io
  IMAGE_IMPLEMENTATION: ghcr.io/${{ github.repository }}/implementation

jobs:
  build-implementation:
    name: Build Implementation Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_IMPLEMENTATION }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push implementation image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: future-go/components/implementation/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_IMPLEMENTATION }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_IMPLEMENTATION }}:buildcache,mode=max

      - name: Test implementation image
        run: |
          docker run --rm \
            -e PORT=8082 \
            -e QUALITY_THRESHOLD=8.0 \
            ${{ env.IMAGE_IMPLEMENTATION }}:latest \
            --help || echo "Service doesn't support --help flag (expected)"

  deploy-k3s:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: [build-implementation]
    if: always() && needs.build-implementation.result == 'success'
    environment:
      name: production-k3s
      url: https://homedir-ai-sdlc.opensourcesantiago.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_K3S }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace
        run: |
          NAMESPACE="${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}"
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace $NAMESPACE name=$NAMESPACE --overwrite

      - name: Deploy implementation with Helm
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
          IMAGE_TAG: latest
        run: |
          helm upgrade --install ai-sdlc-implementation ./deploy/helm/implementation \
            --namespace $NAMESPACE \
            --create-namespace \
            --set image.tag=$IMAGE_TAG \
            --values ./deploy/gitops/implementation-values.yaml \
            --wait \
            --timeout 5m

      - name: Verify deployment
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n $NAMESPACE -l app.kubernetes.io/component=implementation

          echo ""
          echo "=== Pods ==="
          kubectl get pods -n $NAMESPACE -l app.kubernetes.io/component=implementation

          echo ""
          echo "=== Services ==="
          kubectl get svc -n $NAMESPACE -l app.kubernetes.io/component=implementation

          echo ""
          echo "=== Implementation Pod Description ==="
          POD=$(kubectl get pod -n $NAMESPACE -l app.kubernetes.io/component=implementation -o jsonpath='{.items[0].metadata.name}')
          kubectl describe pod $POD -n $NAMESPACE || echo "Pod not ready yet"

      - name: Wait for implementation to be ready
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          echo "Waiting for implementation deployment to be ready..."
          kubectl wait --for=condition=available \
            --timeout=300s \
            deployment -l app.kubernetes.io/component=implementation \
            -n $NAMESPACE

          echo "Implementation deployment is ready!"

      - name: Check implementation logs
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          echo "=== Implementation Logs (last 50 lines) ==="
          POD=$(kubectl get pod -n $NAMESPACE -l app.kubernetes.io/component=implementation -o jsonpath='{.items[0].metadata.name}')
          kubectl logs $POD -n $NAMESPACE --tail=50 || echo "Logs not available yet"

      - name: Check health endpoint
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          echo "=== Implementation Health Check ==="
          POD=$(kubectl get pod -n $NAMESPACE -l app.kubernetes.io/component=implementation -o jsonpath='{.items[0].metadata.name}')

          # Wait for service to be ready
          sleep 10

          # Check health endpoint
          kubectl exec $POD -n $NAMESPACE -- curl -f http://localhost:8082/health 2>/dev/null || \
            echo "Health endpoint not responding yet (service may still be initializing)"

      - name: Create deployment summary
        if: always()
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 Implementation Service Deployment Complete

          ## Image Deployed
          - **Implementation**: \`${{ env.IMAGE_IMPLEMENTATION }}:latest\`
          - **Commit**: \`${{ github.sha }}\`
          - **Namespace**: \`$NAMESPACE\`

          ## API Endpoints
          - **Generate Code**: \`POST http://implementation-svc:8082/api/implementation/generate\`
          - **Health Check**: \`GET http://implementation-svc:8082/health\`

          ## Service Discovery
          Worker can call implementation service at:
          \`\`\`
          http://$(kubectl get svc -n $NAMESPACE -l app.kubernetes.io/component=implementation -o jsonpath='{.items[0].metadata.name}').$NAMESPACE.svc.cluster.local:8082
          \`\`\`

          ## Resources
          \`\`\`
          $(kubectl get all -n $NAMESPACE -l app.kubernetes.io/component=implementation)
          \`\`\`

          ## Next Steps
          - Monitor service: \`kubectl logs -f -n $NAMESPACE -l app.kubernetes.io/component=implementation\`
          - Test health: \`kubectl exec -n $NAMESPACE deployment/implementation -- curl http://localhost:8082/health\`
          - Update worker to call implementation service for multi-pass generation
          EOF

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Implementation Deployment Failed::Failed to deploy Implementation Service to K3s cluster"
