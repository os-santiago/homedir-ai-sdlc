name: Build and Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'dashboard/**'
      - 'container/**'
      - '.github/workflows/deploy-production.yml'

  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: 'false'

env:
  REGISTRY: quay.io
  REPOSITORY: quay.io/os-santiago/homedir-ai

jobs:
  build-worker:
    name: Build Worker Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push worker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: container/Containerfile.worker
          push: true
          tags: |
            ${{ env.REPOSITORY }}:worker-latest
            ${{ env.REPOSITORY }}:worker-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPOSITORY }}:worker-buildcache
          cache-to: type=registry,ref=${{ env.REPOSITORY }}:worker-buildcache,mode=max

      - name: Test worker image
        run: |
          docker run --rm \
            -e GH_TOKEN=test_placeholder \
            -e HOMEDIR_SDLC_REPO=os-santiago/homedir \
            ${{ env.REPOSITORY }}:worker-latest \
            --help

  build-dashboard:
    name: Build Dashboard Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Create dashboard Containerfile
        run: |
          cat > container/Containerfile.dashboard << 'EOF'
          FROM maven:3.9-eclipse-temurin-21 AS build
          WORKDIR /app
          COPY dashboard/quarkus-app/pom.xml .
          RUN mvn dependency:go-offline -B
          COPY dashboard/quarkus-app/src ./src
          RUN mvn package -DskipTests -B

          FROM eclipse-temurin:21-jre-jammy
          RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY --from=build /app/target/quarkus-app /app

          RUN useradd -m -s /bin/bash -u 1000 dashboard && \
              chown -R dashboard:dashboard /app

          USER dashboard
          EXPOSE 8080

          HEALTHCHECK --interval=30s --timeout=10s --start-period=60s --retries=3 \
              CMD curl -f http://localhost:8080/q/health/live || exit 1

          ENV QUARKUS_HTTP_PORT=8080
          ENV HOMEDIR_SDLC_STATE_DIR=/var/lib/homedir-sdlc

          CMD ["java", "-jar", "/app/quarkus-run.jar"]
          EOF

      - name: Build and push dashboard image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: container/Containerfile.dashboard
          push: true
          tags: |
            ${{ env.REPOSITORY }}:dashboard-latest
            ${{ env.REPOSITORY }}:dashboard-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          no-cache: true
          cache-from: type=registry,ref=${{ env.REPOSITORY }}:dashboard-buildcache
          cache-to: type=registry,ref=${{ env.REPOSITORY }}:dashboard-buildcache,mode=max

  build-implementation:
    name: Build Implementation Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push implementation image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: future-go/components/implementation/Containerfile
          push: true
          tags: |
            ${{ env.REPOSITORY }}:implementation-latest
            ${{ env.REPOSITORY }}:implementation-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPOSITORY }}:implementation-buildcache
          cache-to: type=registry,ref=${{ env.REPOSITORY }}:implementation-buildcache,mode=max

      - name: Test implementation image
        run: |
          docker run --rm \
            -e PORT=8082 \
            -e NVIDIA_API_KEY=test_placeholder \
            ${{ env.REPOSITORY }}:implementation-latest \
            --help || echo "Service doesn't support --help (expected)"

  notify-deployment:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: [build-worker, build-dashboard, build-implementation]
    if: always()

    steps:
      - name: Report build status
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_SHA: ${{ github.sha }}
          WORKER_BUILD_SUCCESS: ${{ needs.build-worker.result == 'success' }}
          DASHBOARD_BUILD_SUCCESS: ${{ needs.build-dashboard.result == 'success' }}
          IMPLEMENTATION_BUILD_SUCCESS: ${{ needs.build-implementation.result == 'success' }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GITHUB_SHA,WORKER_BUILD_SUCCESS,DASHBOARD_BUILD_SUCCESS,IMPLEMENTATION_BUILD_SUCCESS,GH_TOKEN,OPENAI_API_KEY
          script: |
            set -e

            echo "=== AI-SDLC Production Deployment ==="
            echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "Commit: $GITHUB_SHA"
            echo "Worker build: $WORKER_BUILD_SUCCESS"
            echo "Dashboard build: $DASHBOARD_BUILD_SUCCESS"
            echo "Implementation build: $IMPLEMENTATION_BUILD_SUCCESS"
            echo ""

            # Create worker environment file from secrets
            # Using printf to avoid YAML heredoc syntax issues
            echo "Creating worker environment configuration..."
            mkdir -p /etc/homedir-sdlc
            printf '%s\n' \
              '# AI-SDLC Worker Environment (auto-generated by GitHub Actions)' \
              "GH_TOKEN=${GH_TOKEN}" \
              "NVIDIA_API_KEY=${NVIDIA_API_KEY}" \
              'HOMEDIR_SDLC_REPO=os-santiago/homedir' \
              'HOMEDIR_SDLC_STATE_DIR=/var/lib/homedir-sdlc' \
              'HOMEDIR_SDLC_WORKDIR=/srv/homedir-sdlc/worktrees/homedir' \
              'PLATFORM_DIR=/app' \
              'HOMEDIR_SDLC_LOGFILE=/var/log/homedir-sdlc/worker.log' \
              'HOMEDIR_SDLC_GIT_USER_NAME=homedir-sdlc[bot]' \
              'HOMEDIR_SDLC_GIT_USER_EMAIL=homedir-sdlc@users.noreply.github.com' \
              'SCC_BIN=scc' \
              'SCC_TIMEOUT_SECONDS=600' \
              'SCC_CLEAR_HISTORY=true' \
              'HOMEDIR_SDLC_INTERVAL=180' \
              'HOMEDIR_SDLC_ENABLE_AUTOMERGE=true' \
              'IMPLEMENTATION_SERVICE_URL=http://localhost:8082' \
              "HOMEDIR_SDLC_WORKER_VERSION=${GITHUB_SHA}" \
              > /etc/homedir-sdlc/worker.env

            chmod 600 /etc/homedir-sdlc/worker.env
            echo "Worker environment configured with secrets from GitHub Actions"

            # Stop existing pod
            echo "Stopping existing AI-SDLC pod..."
            podman pod stop ai-sdlc 2>/dev/null || true
            podman pod rm ai-sdlc 2>/dev/null || true

            # Create new pod (port 8083 to avoid conflict with ai-sdlc-events on 8081)
            echo "Creating new pod..."
            podman pod create \
              --name ai-sdlc \
              -p 8083:8080

            # Deploy worker (always - this job only runs if worker build succeeded)
            if [ "$WORKER_BUILD_SUCCESS" = "true" ]; then
              echo "Pulling worker image..."
              podman pull ${{ env.REPOSITORY }}:worker-latest

              echo "Starting worker container..."
              WORKER_CONTAINER_ID=$(podman run -d \
                --pod ai-sdlc \
                --name ai-sdlc-worker \
                --restart unless-stopped \
                --env-file /etc/homedir-sdlc/worker.env \
                -v /var/lib/homedir-sdlc:/var/lib/homedir-sdlc \
                -v /srv/homedir-sdlc/worktrees:/srv/homedir-sdlc/worktrees \
                ${{ env.REPOSITORY }}:worker-latest)

              echo "Worker container ID: $WORKER_CONTAINER_ID"

              # Wait for container to initialize
              sleep 10

              # Check if container is still running
              WORKER_STATUS=$(podman inspect ai-sdlc-worker --format='{{.State.Status}}' 2>/dev/null || echo "not-found")
              echo "Worker status after 10s: $WORKER_STATUS"

              if [ "$WORKER_STATUS" != "running" ]; then
                echo "ERROR: Worker container is not running (status: $WORKER_STATUS)"
                echo "Container logs:"
                podman logs ai-sdlc-worker 2>&1 || echo "Failed to retrieve logs"
                echo ""
                echo "Environment file content (secrets redacted):"
                sed 's/=.*/=***REDACTED***/g' /etc/homedir-sdlc/worker.env
                exit 1
              fi

              echo "✅ Worker container is running"
            else
              echo "⚠️  Worker build failed - skipping worker deployment"
            fi

            # Deploy dashboard (conditional - only if build succeeded)
            if [ "$DASHBOARD_BUILD_SUCCESS" = "true" ]; then
              echo "Pulling dashboard image..."
              podman pull ${{ env.REPOSITORY }}:dashboard-latest

              echo "Starting dashboard container..."
              podman run -d \
                --pod ai-sdlc \
                --name ai-sdlc-dashboard \
                --restart unless-stopped \
                -e HOMEDIR_SDLC_STATE_DIR=/var/lib/homedir-sdlc \
                -v /var/lib/homedir-sdlc:/var/lib/homedir-sdlc:ro \
                ${{ env.REPOSITORY }}:dashboard-latest
            else
              echo "⚠️  Dashboard build failed - skipping dashboard deployment"
              echo "Worker can operate independently without dashboard"
            fi

            # Deploy implementation service (conditional - only if build succeeded)
            if [ "$IMPLEMENTATION_BUILD_SUCCESS" = "true" ]; then
              echo "Pulling implementation image..."
              podman pull ${{ env.REPOSITORY }}:implementation-latest

              echo "Starting implementation container..."
              podman run -d \
                --pod ai-sdlc \
                --name ai-sdlc-implementation \
                --restart unless-stopped \
                -e PORT=8082 \
                -e SC_PROFILE=openai \
                -e SC_AGENT_PATH=/usr/local/bin/scc \
                -e MAX_IMPLEMENTATION_ITERATIONS=3 \
                -e QUALITY_THRESHOLD=8.0 \
                -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
                ${{ env.REPOSITORY }}:implementation-latest

              # Verify implementation is running
              sleep 5
              IMPL_STATUS=$(podman inspect ai-sdlc-implementation --format='{{.State.Status}}' 2>/dev/null || echo "not-found")
              echo "Implementation status: $IMPL_STATUS"
            else
              echo "⚠️  Implementation build failed - skipping implementation deployment"
              echo "Worker will fall back to direct SCC generation"
            fi

            # Wait for containers to be healthy
            echo ""
            echo "Waiting for containers to be healthy..."
            sleep 30

            # Check health
            if podman container exists ai-sdlc-worker; then
              echo "Worker status: $(podman inspect ai-sdlc-worker --format='{{.State.Status}}')"
            fi
            if podman container exists ai-sdlc-dashboard; then
              echo "Dashboard status: $(podman inspect ai-sdlc-dashboard --format='{{.State.Status}}')"
            fi
            if podman container exists ai-sdlc-implementation; then
              echo "Implementation status: $(podman inspect ai-sdlc-implementation --format='{{.State.Status}}')"
              echo "Testing implementation health endpoint..."
              curl -f http://localhost:8082/health || echo "Implementation health check pending..."
            fi

            # Verify heartbeat
            if [ -f /var/lib/homedir-sdlc/heartbeat.json ]; then
              echo ""
              echo "Worker heartbeat:"
              cat /var/lib/homedir-sdlc/heartbeat.json | jq '.'
            fi

            echo ""
            echo "Deployment complete!"
            if [ "$DASHBOARD_BUILD_SUCCESS" = "true" ]; then
              echo "Dashboard: http://localhost:8083 (internal)"
              echo "Public URL: https://homedir-ai-sdlc.opensourcesantiago.io"
            fi

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "=== Deployment Verification ==="

            # Check pod status
            podman pod ps | grep ai-sdlc

            # Check container logs (last 20 lines)
            echo ""
            echo "=== Worker Logs (last 20 lines) ==="
            podman logs --tail 20 ai-sdlc-worker

            echo ""
            echo "=== Dashboard Logs (last 10 lines) ==="
            podman logs --tail 10 ai-sdlc-dashboard

            # Test dashboard endpoint
            echo ""
            echo "=== Dashboard Health Check ==="
            curl -f http://localhost:8083/q/health/live || echo "Dashboard not ready yet"

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 AI-SDLC Production Deployment

          ## Images Deployed
          - **Worker**: \`${{ env.REPOSITORY }}:worker-latest\`
          - **Dashboard**: \`${{ env.REPOSITORY }}:dashboard-latest\`
          - **Implementation**: \`${{ env.REPOSITORY }}:implementation-latest\`
          - **Commit**: \`${{ github.sha }}\`

          ## Services
          - 🔧 Worker: Running in pod \`ai-sdlc\`
          - 📊 Dashboard: https://homedir-ai-sdlc.opensourcesantiago.io
          - ⚙️ Implementation: Internal service (port 8082)

          ## Architecture
          \`\`\`
          Pod: ai-sdlc (port 8083 → dashboard:8080)
          ├── ai-sdlc-worker (internal)
          ├── ai-sdlc-dashboard (8080 → pod 8083)
          └── ai-sdlc-implementation (8082, internal)
          \`\`\`

          ## Next Steps
          - Monitor worker logs: \`podman logs -f ai-sdlc-worker\`
          - Monitor implementation logs: \`podman logs -f ai-sdlc-implementation\`
          - Monitor heartbeat: \`cat /var/lib/homedir-sdlc/heartbeat.json\`
          - Check dashboard: Visit URL above
          - Test implementation: \`curl http://localhost:8082/health\` (from VPS)
          EOF

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Deployment Failed::Failed to deploy AI-SDLC to production"
