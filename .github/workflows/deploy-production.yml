name: Build and Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'dashboard/**'
      - 'container/**'
      - '.github/workflows/deploy-production.yml'

  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_WORKER: ghcr.io/${{ github.repository }}/worker
  IMAGE_DASHBOARD: ghcr.io/${{ github.repository }}/dashboard

jobs:
  build-worker:
    name: Build Worker Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WORKER }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push worker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: container/Containerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_WORKER }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_WORKER }}:buildcache,mode=max

      - name: Test worker image
        run: |
          docker run --rm \
            -e GH_TOKEN=test_placeholder \
            -e HOMEDIR_SDLC_REPO=os-santiago/homedir \
            ${{ env.IMAGE_WORKER }}:latest \
            --help

  build-dashboard:
    name: Build Dashboard Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_DASHBOARD }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Create dashboard Containerfile
        run: |
          cat > container/Containerfile.dashboard << 'EOF'
          FROM maven:3.9-eclipse-temurin-21 AS build
          WORKDIR /app
          COPY dashboard/quarkus-app/pom.xml .
          RUN mvn dependency:go-offline -B
          COPY dashboard/quarkus-app/src ./src
          RUN mvn package -DskipTests -B

          FROM eclipse-temurin:21-jre-jammy
          RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY --from=build /app/target/quarkus-app /app

          RUN useradd -m -s /bin/bash -u 1000 dashboard && \
              chown -R dashboard:dashboard /app

          USER dashboard
          EXPOSE 8080

          HEALTHCHECK --interval=30s --timeout=10s --start-period=60s --retries=3 \
              CMD curl -f http://localhost:8080/q/health/live || exit 1

          ENV QUARKUS_HTTP_PORT=8080
          ENV HOMEDIR_SDLC_STATE_DIR=/var/lib/homedir-sdlc

          CMD ["java", "-jar", "/app/quarkus-run.jar"]
          EOF

      - name: Build and push dashboard image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: container/Containerfile.dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_DASHBOARD }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_DASHBOARD }}:buildcache,mode=max

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-worker, build-dashboard]
    # Deploy is optional - will skip if secrets not configured
    continue-on-error: true
    environment:
      name: production
      url: https://homedir-ai-sdlc.opensourcesantiago.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GITHUB_SHA
          script_stop: true
          script: |
            set -e

            echo "=== AI-SDLC Production Deployment ==="
            echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "Commit: $GITHUB_SHA"
            echo ""

            # Pull latest images
            echo "Pulling worker image..."
            podman pull ${{ env.IMAGE_WORKER }}:latest

            echo "Pulling dashboard image..."
            podman pull ${{ env.IMAGE_DASHBOARD }}:latest

            # Stop existing pod
            echo "Stopping existing AI-SDLC pod..."
            podman pod stop ai-sdlc 2>/dev/null || true
            podman pod rm ai-sdlc 2>/dev/null || true

            # Create new pod
            echo "Creating new pod..."
            podman pod create \
              --name ai-sdlc \
              -p 8081:8080

            # Start worker container
            echo "Starting worker container..."
            podman run -d \
              --pod ai-sdlc \
              --name ai-sdlc-worker \
              --restart unless-stopped \
              --env-file /etc/homedir-sdlc/worker.env \
              -v /var/lib/homedir-sdlc:/var/lib/homedir-sdlc \
              -v /srv/homedir-sdlc/worktrees:/srv/homedir-sdlc/worktrees \
              ${{ env.IMAGE_WORKER }}:latest

            # Start dashboard container
            echo "Starting dashboard container..."
            podman run -d \
              --pod ai-sdlc \
              --name ai-sdlc-dashboard \
              --restart unless-stopped \
              -e HOMEDIR_SDLC_STATE_DIR=/var/lib/homedir-sdlc \
              -v /var/lib/homedir-sdlc:/var/lib/homedir-sdlc:ro \
              ${{ env.IMAGE_DASHBOARD }}:latest

            # Wait for containers to be healthy
            echo ""
            echo "Waiting for containers to be healthy..."
            sleep 30

            # Check health
            echo "Worker status: $(podman inspect ai-sdlc-worker --format='{{.State.Status}}')"
            echo "Dashboard status: $(podman inspect ai-sdlc-dashboard --format='{{.State.Status}}')"

            # Verify heartbeat
            if [ -f /var/lib/homedir-sdlc/heartbeat.json ]; then
              echo ""
              echo "Worker heartbeat:"
              cat /var/lib/homedir-sdlc/heartbeat.json | jq '.'
            fi

            echo ""
            echo "Deployment complete!"
            echo "Dashboard: https://homedir-ai-sdlc.opensourcesantiago.io"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "=== Deployment Verification ==="

            # Check pod status
            podman pod ps | grep ai-sdlc

            # Check container logs (last 20 lines)
            echo ""
            echo "=== Worker Logs (last 20 lines) ==="
            podman logs --tail 20 ai-sdlc-worker

            echo ""
            echo "=== Dashboard Logs (last 10 lines) ==="
            podman logs --tail 10 ai-sdlc-dashboard

            # Test dashboard endpoint
            echo ""
            echo "=== Dashboard Health Check ==="
            curl -f http://localhost:8081/q/health/live || echo "Dashboard not ready yet"

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 AI-SDLC Production Deployment

          ## Images Deployed
          - **Worker**: \`${{ env.IMAGE_WORKER }}:latest\`
          - **Dashboard**: \`${{ env.IMAGE_DASHBOARD }}:latest\`
          - **Commit**: \`${{ github.sha }}\`

          ## Services
          - 🔧 Worker: Running in pod \`ai-sdlc\`
          - 📊 Dashboard: https://homedir-ai-sdlc.opensourcesantiago.io

          ## Next Steps
          - Monitor worker logs: \`podman logs -f ai-sdlc-worker\`
          - Monitor heartbeat: \`cat /var/lib/homedir-sdlc/heartbeat.json\`
          - Check dashboard: Visit URL above
          EOF

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Deployment Failed::Failed to deploy AI-SDLC to production"
