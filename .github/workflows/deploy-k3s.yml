name: Deploy to K3s

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'container/**'
      - 'deploy/helm/worker/**'
      - '.github/workflows/deploy-k3s.yml'

  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: 'false'
      namespace:
        description: 'Kubernetes namespace'
        required: false
        default: 'homedir-ai-sdlc'

env:
  REGISTRY: ghcr.io
  IMAGE_WORKER: ghcr.io/${{ github.repository }}/worker

jobs:
  build-worker:
    name: Build Worker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_WORKER }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push worker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: container/Containerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_WORKER }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_WORKER }}:buildcache,mode=max

      - name: Test worker image
        run: |
          docker run --rm \
            -e GH_TOKEN=test_placeholder \
            -e NVIDIA_API_KEY=test_placeholder \
            -e HOMEDIR_SDLC_REPO=os-santiago/homedir \
            ${{ env.IMAGE_WORKER }}:latest \
            --help

  deploy-k3s:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: [build-worker]
    if: always() && needs.build-worker.result == 'success'
    environment:
      name: production-k3s
      url: https://homedir-ai-sdlc.opensourcesantiago.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_K3S }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          # Verify connection
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace
        run: |
          NAMESPACE="${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}"
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace $NAMESPACE name=$NAMESPACE --overwrite

      - name: Create or update secrets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          # Delete existing secret if exists (to update values)
          kubectl delete secret ai-sdlc-worker-secrets \
            -n $NAMESPACE \
            --ignore-not-found=true

          # Create new secret with current values
          kubectl create secret generic ai-sdlc-worker-secrets \
            --from-literal=GH_TOKEN="$GH_TOKEN" \
            --from-literal=NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            -n $NAMESPACE

          # Verify secret created
          kubectl get secret ai-sdlc-worker-secrets -n $NAMESPACE

      - name: Deploy worker with Helm
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
          IMAGE_TAG: latest
        run: |
          helm upgrade --install ai-sdlc-worker ./deploy/helm/worker \
            --namespace $NAMESPACE \
            --create-namespace \
            --set image.tag=$IMAGE_TAG \
            --set secrets.create=false \
            --set secrets.existingSecret=ai-sdlc-worker-secrets \
            --wait \
            --timeout 5m

      - name: Verify deployment
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n $NAMESPACE

          echo ""
          echo "=== Pods ==="
          kubectl get pods -n $NAMESPACE

          echo ""
          echo "=== PVCs ==="
          kubectl get pvc -n $NAMESPACE

          echo ""
          echo "=== Worker Pod Description ==="
          POD=$(kubectl get pod -n $NAMESPACE -l app.kubernetes.io/name=worker -o jsonpath='{.items[0].metadata.name}')
          kubectl describe pod $POD -n $NAMESPACE

      - name: Wait for worker to be ready
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          echo "Waiting for worker deployment to be ready..."
          kubectl wait --for=condition=available \
            --timeout=300s \
            deployment/ai-sdlc-worker \
            -n $NAMESPACE

          echo "Worker deployment is ready!"

      - name: Check worker logs
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          echo "=== Worker Logs (last 50 lines) ==="
          POD=$(kubectl get pod -n $NAMESPACE -l app.kubernetes.io/name=worker -o jsonpath='{.items[0].metadata.name}')
          kubectl logs $POD -n $NAMESPACE --tail=50 || echo "Logs not available yet"

      - name: Check heartbeat
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          echo "=== Worker Heartbeat ==="
          POD=$(kubectl get pod -n $NAMESPACE -l app.kubernetes.io/name=worker -o jsonpath='{.items[0].metadata.name}')

          # Wait a bit for first heartbeat
          sleep 30

          # Check heartbeat file
          kubectl exec $POD -n $NAMESPACE -- cat /var/lib/homedir-sdlc/heartbeat.json 2>/dev/null || \
            echo "Heartbeat not available yet (worker may still be initializing)"

      - name: Create deployment summary
        if: always()
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'homedir-ai-sdlc' }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 K3s Deployment Complete

          ## Image Deployed
          - **Worker**: \`${{ env.IMAGE_WORKER }}:latest\`
          - **Commit**: \`${{ github.sha }}\`
          - **Namespace**: \`$NAMESPACE\`

          ## Resources
          \`\`\`
          $(kubectl get all -n $NAMESPACE)
          \`\`\`

          ## Next Steps
          - Monitor worker: \`kubectl logs -f deployment/ai-sdlc-worker -n $NAMESPACE\`
          - Check heartbeat: \`kubectl exec deployment/ai-sdlc-worker -n $NAMESPACE -- cat /var/lib/homedir-sdlc/heartbeat.json\`
          - Port forward dashboard: \`kubectl port-forward deployment/ai-sdlc-dashboard 8080:8080 -n $NAMESPACE\`
          EOF

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=K3s Deployment Failed::Failed to deploy AI-SDLC worker to K3s cluster"
