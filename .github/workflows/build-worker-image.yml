name: Build Worker Container Image

on:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - 'platform/**'
      - '.github/workflows/build-worker-image.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build reason'
        required: false
        default: 'Manual build'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Worker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-worker
          tags: |
            type=raw,value=latest
            type=sha,prefix={{date 'YYYYMMDD-HHmmss'}}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Containerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        run: |
          echo "### Worker Image Built Successfully ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images published:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository }}-worker:latest" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository }}-worker:$(date +%Y%m%d-%H%M%S)-${{ github.sha:0:7 }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Includes:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ sc-agent-cli (SCC) from GitHub" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Worker scripts from platform/" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Autonomous decision policies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next:**" >> $GITHUB_STEP_SUMMARY
          echo "K3s will auto-pull this image on next CronJob execution (every 3 minutes)" >> $GITHUB_STEP_SUMMARY
