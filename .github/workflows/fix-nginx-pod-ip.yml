name: Fix Nginx - Use Pod IP

on:
  workflow_dispatch:

jobs:
  fix-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Update nginx to use pod IP
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "=== Finding Pod IP Address ==="

            # Get pod IP
            POD_IP=$(podman pod inspect ai-sdlc --format '{{.InfraContainerID}}' | xargs podman inspect --format '{{.NetworkSettings.IPAddress}}')
            echo "Pod IP: $POD_IP"

            if [ -z "$POD_IP" ]; then
              echo "ERROR: Could not find pod IP"
              exit 1
            fi

            # Update nginx configuration
            echo ""
            echo "=== Updating nginx configuration ==="
            sudo sed -i "s|proxy_pass http://[0-9.]*:8080|proxy_pass http://${POD_IP}:8080|g" \
              /etc/nginx/sites-available/homedir-ai-sdlc.conf

            # Also update if it was changed to localhost:8081
            sudo sed -i "s|proxy_pass http://localhost:8081|proxy_pass http://${POD_IP}:8080|g" \
              /etc/nginx/sites-available/homedir-ai-sdlc.conf

            echo "New configuration:"
            sudo grep proxy_pass /etc/nginx/sites-available/homedir-ai-sdlc.conf

            # Test configuration
            echo ""
            echo "Testing nginx configuration..."
            sudo nginx -t

            # Reload nginx
            echo ""
            echo "Reloading nginx..."
            sudo systemctl reload nginx

            echo ""
            echo "✅ Nginx configuration updated to use pod IP: $POD_IP:8080"

            # Test endpoint from inside VPS
            echo ""
            echo "Testing dashboard endpoint on pod IP..."
            curl -f http://${POD_IP}:8080/q/health/live || echo "Dashboard not responding"

            # Test via nginx
            echo ""
            echo "Testing via nginx..."
            curl -f http://localhost/sdlc/api/status | head -20 || echo "Not accessible via nginx yet"
