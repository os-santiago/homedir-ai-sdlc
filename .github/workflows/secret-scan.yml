name: Secret Scan
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public repository without credentials or submodule traversal
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git -c credential.helper= fetch --no-tags "$SOURCE_URL" "$SOURCE_SHA"
          git -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
      - name: Install checksum-pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan tracked tree and commits since remediation boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/scan-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/scan-tree"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir "$RUNNER_TEMP/scan-tree" --config .gitleaks.toml --redact=100 --no-banner --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null
          # Earlier exposed history is tracked by #98 and still requires revocation.
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --config .gitleaks.toml --redact=100 --no-banner --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null \
            --log-opts="74c48e74147cbd7dd4f34fbb4dbf3bedd37ff506..HEAD"
      - name: Verify NVIDIA rule rejects a synthetic token
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/secret-canary"
          printf 'NVIDIA_API_KEY=nvapi-%064d\n' 0 > "$RUNNER_TEMP/secret-canary/example.env"
          status=0
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir "$RUNNER_TEMP/secret-canary" --config .gitleaks.toml --redact=100 --no-banner --log-level error || status=$?
          test "$status" -eq 1
