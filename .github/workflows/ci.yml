name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'events-service/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  events-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: events-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: ./mvnw clean verify -B
