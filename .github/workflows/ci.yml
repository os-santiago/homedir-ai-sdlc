name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'events-service/**'
      - 'platform/scripts/homedir-sdlc-worker.sh'
      - 'tests/test_worker_exit_codes.py'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check worker syntax and exit handling
        run: |
          bash -n platform/scripts/homedir-sdlc-worker.sh
          python3 -m unittest discover -s tests -p 'test_worker_exit_codes.py' -v

  events-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: |
          cd events-service
          # TODO: Fix H2 compatibility in SQL migrations (gen_random_uuid, JSONB)
          ./mvnw clean package -B -DskipTests
