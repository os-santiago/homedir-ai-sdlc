name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/gofmt-output
          test ! -s /tmp/gofmt-output
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./...

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m json.tool contracts/events/v1/issue-admission-decided.schema.json >/dev/null
      - run: python -m json.tool contracts/commands/v1/work-item-ready.schema.json >/dev/null

  gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - run: kustomize build deploy/gitops/overlays/development >/dev/null
      - run: kustomize build deploy/gitops/overlays/production >/dev/null
