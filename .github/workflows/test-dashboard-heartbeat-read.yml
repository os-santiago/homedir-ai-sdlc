name: Test Dashboard Heartbeat Read

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test dashboard can read heartbeat
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "=== Heartbeat file permissions ==="
            ls -lh /var/lib/homedir-sdlc/heartbeat.json

            echo ""
            echo "=== Heartbeat content ==="
            cat /var/lib/homedir-sdlc/heartbeat.json | jq '.'

            echo ""
            echo "=== Dashboard can read via podman exec? ==="
            podman exec ai-sdlc-dashboard cat /var/lib/homedir-sdlc/heartbeat.json 2>&1 | head -20 || echo "❌ Cannot read"

            echo ""
            echo "=== Dashboard environment ==="
            podman exec ai-sdlc-dashboard env | grep -i sdlc || echo "No SDLC env vars"

            echo ""
            echo "=== Test via dashboard logs ==="
            echo "Triggering API request..."
            curl -s http://10.88.3.19:8080/api/sdlc/heartbeat | jq '.' || echo "API request failed"

            echo ""
            echo "=== Check dashboard logs for errors ==="
            podman logs --tail 30 ai-sdlc-dashboard 2>&1 | grep -E "(ERROR|WARN|Exception|heartbeat)" || echo "No errors found"
