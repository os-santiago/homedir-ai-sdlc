# AI-SDLC Dashboard Configuration

# Application
quarkus.application.name=ai-sdlc-dashboard
quarkus.http.port=8081

# SDLC Configuration
sdlc.state-dir=${HOMEDIR_SDLC_STATE_DIR:/var/lib/homedir-sdlc}
sdlc.worker-version=${HOMEDIR_SDLC_WORKER_VERSION:unknown}
sdlc.dashboard.snapshot-interval=${HOMEDIR_SDLC_DASHBOARD_SNAPSHOT_INTERVAL:30s}
sdlc.dashboard.controls-enabled=${HOMEDIR_SDLC_DASHBOARD_CONTROLS_ENABLED:false}
sdlc.dashboard.max-events=${HOMEDIR_SDLC_DASHBOARD_MAX_EVENTS:2000}
sdlc.dashboard.max-files-per-cycle=${HOMEDIR_SDLC_DASHBOARD_MAX_FILES_PER_CYCLE:250}
sdlc.dashboard.max-bytes-per-cycle=${HOMEDIR_SDLC_DASHBOARD_MAX_BYTES_PER_CYCLE:65536}

# Health
quarkus.health.extensions.enabled=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.opensourcesantiago.aisdlc".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# HTTP
quarkus.http.enable-compression=true
quarkus.http.http2=true

# Shutdown
quarkus.shutdown.timeout=10s
